[project]
name = "memelite"
version = "0.4.0"
description = "Biological sequence analysis for the modern age."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Jacob Schreiber", email = "jmschreiber91@gmail.com" },
]
dependencies = [
    "numba>=0.55.1",
    "numpy>=1.14.2",
    "pandas>=1.3.3",
    "pyfaidx>=0.7.2.1",
    "tqdm>=4.64.1",
]

[project.urls]
Homepage = "https://github.com/jmschrei/memesuite-lite"

[project.scripts]
ttl = "memelite.cli:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

[tool.pytest.ini_options]
markers = [
    "cmd: tests that invoke the ttl command-line tool",
]
